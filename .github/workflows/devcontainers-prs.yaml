name: "Renovate: devcontainers" 

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs: 
      action:
        description: Action to run
        required: true
        type: choice
        options: 
          - autoreview
          - automerge

jobs:
  auto-review:
    if: |
      (github.event_name == 'schedule' && github.event.schedule=='0 10 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'autoreview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm install -g @siakhooi/gh-pr
      - run: gh-pr autoreview --assigned-to-me --authored-by-renovate --requested-my-review --not-yet-reviewed --limit 10 --repo siakhooi/devcontainers --max-update 1 --max-update-per-repo 1
        env:
          GITHUB_TOKEN: ${{ secrets.ALL_REPO_GITHUB_TOKEN }}

  auto-merge:
    if: |
      (github.event_name == 'schedule' && github.event.schedule=='0 14 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'automerge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm install -g @siakhooi/gh-pr
      - run: gh-pr automerge --assigned-to-me --authored-by-renovate --limit 10 --repo siakhooi/devcontainers --max-update 1 --max-update-per-repo 1
        env:
          GITHUB_TOKEN: ${{ secrets.ALL_REPO_GITHUB_TOKEN }}
