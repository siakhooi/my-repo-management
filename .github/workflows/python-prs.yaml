name: "Dependabot: python" 

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  list-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm install -g @siakhooi/gh-pr
      - run: gh-pr list --assigned-to-me --authored-by-dependabot --label dependencies --not-yet-reviewed -l 10 --label python
        env:
          GITHUB_TOKEN: ${{ secrets.ALL_REPO_GITHUB_TOKEN }}
